[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "outlook-email-mcp"
version = "0.1.0"
description = "Windows-first Outlook and IMAP/SMTP email MCP server"
requires-python = ">=3.10"
dependencies = ["mcp>=1.0,<2"]

[project.optional-dependencies]
windows = ["pywin32>=306; platform_system == 'Windows'"]
test = ["pytest>=7"]

[project.scripts]
outlook-email-mcp = "outlook_email_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
